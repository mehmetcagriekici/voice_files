[project]
name = "voice-files"
version = "0.1.0"
description = "Read text and Markdown files aloud from the terminal, offline."
requires-python = ">=3.10"
dependencies = ["markdown-it-py>=3.0", "piper-tts>=1.3"]

[project.scripts]
voice-files = "voice_files:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["voice_files"]
